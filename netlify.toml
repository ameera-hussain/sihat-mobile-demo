[build]
command = "curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.4-stable.tar.xz -o /tmp/flutter.tar.xz && tar -xf /tmp/flutter.tar.xz -C /tmp && export PATH=\"/tmp/flutter/bin:$PATH\" && flutter config --no-analytics && flutter build web --release"
publish = "build/web"